spring:
  config:
    import: "optional:file:./.env.properties"   # local secrets, git-ignored
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/cg}
    username: ${DATABASE_USER:cg}
    password: ${DATABASE_PASSWORD:cg}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB      # above the 20 MB app limit, so users get CG's own error message
      max-request-size: 25MB
cg:
  jwt:
    secret: ${JWT_SECRET:}
  llm:   # optional: without a key, scans still run and findings simply have no AI explanation
    base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:openai/gpt-oss-120b}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized   # public callers only see UP or DOWN
