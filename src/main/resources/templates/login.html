<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Log in', false)}"></head>
<body>
<main class="narrow">
  <h1>Log in to CG</h1>
  <p class="notice ok" th:if="${param.registered}">Account created. Log in below.</p>
  <p class="notice ok" th:if="${param.logout}">You're logged out.</p>
  <p class="notice error" th:if="${param.error}">Email or password is wrong.</p>
  <p class="notice error" th:if="${param.locked}">Too many wrong attempts. Wait 15 minutes, then try again.</p>
  <form class="card stack" th:action="@{/login}" method="post">
    <label>Email <input type="email" name="username" autocomplete="username" required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Log in</button>
  </form>
  <p>No account? <a th:href="@{/register}">Create one</a></p>
</main>
</body>
</html>
