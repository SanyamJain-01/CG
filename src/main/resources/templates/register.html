<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Create account', false)}"></head>
<body>
<main class="narrow">
  <h1>Create an account</h1>
  <p class="notice error" th:if="${error}" th:text="${error}">Error</p>
  <form class="card stack" th:action="@{/register}" method="post">
    <label>Email <input type="email" name="email" th:value="${email}" autocomplete="username" required maxlength="254"></label>
    <label>Password <span class="hint">12 to 128 characters</span>
      <input type="password" name="password" autocomplete="new-password" required minlength="12" maxlength="128"></label>
    <button class="primary" type="submit">Create account</button>
  </form>
  <p>Already registered? <a th:href="@{/login}">Log in</a></p>
</main>
</body>
</html>
