# Pinned versions only stay safe if they're updated: Dependabot opens a PR when a new release appears.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # stay on the Java 21 LTS line; moving to the next LTS is a deliberate change, not a weekly bump
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
